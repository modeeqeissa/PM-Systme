openapi: 3.0.3
info:
  title: PMP Training & Certification Service
  version: "1.0"
  description: >
    Implements FR-TRAIN-01..03 (docs Section 4.5). FastAPI must generate a
    schema that matches this contract — treat mismatches as a bug, not a spec
    update, unless the SRS itself is being revised.

    All endpoints require a bearer access token (RS256 JWT) issued by
    iam-service; its signature is verified against iam-service's JWKS and the
    required `training.cert.<read|write>` permission must be present in the
    token's `permissions` claim (CLAUDE.md rule 4). Missing/invalid token ->
    401; valid token without the permission -> 403.

    `officer_id` on officer_certifications is a logical reference into
    hr_db.officers (CLAUDE.md rule 1: no cross-service DB access) — it is
    accepted as given, not validated for existence.

    `expires_date` and `status` on officer_certifications are always computed
    server-side (issued_date + the linked course's validity_months) and are
    never accepted from the client. `POST /officer-certifications/recompute-status`
    re-derives every status against today's date (FR-TRAIN-03); the same
    recompute also runs on a periodic background sweep.

    FR-TRAIN-04 (station-level compliance view) is dashboard-service's read
    model, built from the events this service publishes — not an endpoint
    here. FR-TRAIN-05 (blocking duty assignment on missing/expired
    certification) has no supporting hook in hr-service's assignment flow yet
    and is deferred rather than built against invented schema.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /courses:
    post:
      summary: Add a course to the catalog (FR-TRAIN-01)
      description: Requires `training.cert.write`. Publishes a `CourseCreated` domain event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Course" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
    get:
      summary: List courses
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Course" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }

  /courses/{course_id}:
    get:
      summary: Get a course
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: course_id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Course, content: { application/json: { schema: { $ref: "#/components/schemas/Course" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }
        "404": { description: No course with that id }
    patch:
      summary: Update a course
      description: Requires `training.cert.write`. Publishes a `CourseUpdated` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: course_id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Course" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: No course with that id }
    delete:
      summary: Delete a course
      description: >
        Requires `training.cert.write`. Fails with 409 if a certification
        still references this course. Publishes a `CourseDeleted` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: course_id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: No course with that id }
        "409": { description: Course still has certifications referencing it }

  /certifications:
    post:
      summary: Define a certification issuable on completing a course (FR-TRAIN-01)
      description: Requires `training.cert.write`. Publishes a `CertificationCreated` domain event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificationCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Certification" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: course_id does not exist }
    get:
      summary: List certifications
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: course_id, schema: { type: integer } }
      responses:
        "200":
          description: Certifications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Certification" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }

  /certifications/{certification_id}:
    get:
      summary: Get a certification
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: certification_id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Certification, content: { application/json: { schema: { $ref: "#/components/schemas/Certification" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }
        "404": { description: No certification with that id }
    delete:
      summary: Delete a certification
      description: >
        Requires `training.cert.write`. Fails with 409 if an officer
        certification still references this certification. Publishes a
        `CertificationDeleted` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: certification_id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: No certification with that id }
        "409": { description: Certification still has officer_certifications referencing it }

  /officer-certifications:
    post:
      summary: Issue a certification to an officer (FR-TRAIN-02)
      description: >
        Requires `training.cert.write`. `expires_date` and `status` are
        computed server-side, not accepted from the client. Publishes an
        `OfficerCertificationIssued` domain event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfficerCertificationCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/OfficerCertification" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: certification_id does not exist }
    get:
      summary: List issued officer certifications
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: officer_id, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [active, expiring_soon, expired] } }
      responses:
        "200":
          description: Officer certifications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OfficerCertification" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }

  /officer-certifications/{officer_certification_id}:
    get:
      summary: Get an issued officer certification
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_certification_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Officer certification, content: { application/json: { schema: { $ref: "#/components/schemas/OfficerCertification" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }
        "404": { description: No officer certification with that id }

  /officer-certifications/recompute-status:
    post:
      summary: Recompute expiry status for every issued certification (FR-TRAIN-03)
      description: >
        Requires `training.cert.write`. Re-derives each officer_certification's
        status against today's date; changed rows publish an
        `OfficerCertificationStatusChanged` domain event. The same recompute
        also runs on a periodic background sweep — this endpoint is for
        on-demand/testing use.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Recompute result, content: { application/json: { schema: { $ref: "#/components/schemas/RecomputeResult" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }

  /courses/{course_id}/materials:
    get:
      summary: List a course's materials (FR-TRAIN-01 / docs §9.3.5)
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: course_id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Materials
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Material" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }
        "404": { description: No course with that id }
    post:
      summary: Upload a course material (multipart/form-data)
      description: >
        Requires `training.cert.write`. The file bytes are stored under an
        opaque `file_ref` (object-storage pattern). Publishes a `MaterialAdded`
        domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: course_id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, file]
              properties:
                title: { type: string, maxLength: 200 }
                file: { type: string, format: binary }
      responses:
        "201": { description: Material added, content: { application/json: { schema: { $ref: "#/components/schemas/Material" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: No course with that id }

  /materials/{material_id}:
    get:
      summary: Get a material's metadata
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: material_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Material, content: { application/json: { schema: { $ref: "#/components/schemas/Material" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }
        "404": { description: No material with that id }
    delete:
      summary: Delete a material
      description: Requires `training.cert.write`. Publishes a `MaterialRemoved` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: material_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Material deleted }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: No material with that id }

  /sessions:
    get:
      summary: List scheduled sessions (docs §9.3.5)
      description: Requires `training.cert.read`. Optionally filtered by `course_id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: course_id, schema: { type: integer } }
      responses:
        "200":
          description: Sessions, soonest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }
    post:
      summary: Schedule a session (a concrete instance of a course)
      description: Requires `training.cert.write`. Publishes a `SessionScheduled` domain event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionCreate" }
      responses:
        "201": { description: Session scheduled, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: course_id does not exist }

  /sessions/{session_id}:
    get:
      summary: Get a session
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: session_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }
        "404": { description: No session with that id }
    patch:
      summary: Update a scheduled session
      description: >
        Requires `training.cert.write`. `course_id` is not editable (schedule a
        new session for a different course). Publishes a `SessionUpdated` event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: session_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: No session with that id }

  /sessions/{session_id}/attendance:
    get:
      summary: List a session's attendance (docs §9.3.5)
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: session_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Attendance rows
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Attendance" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }
        "404": { description: No session with that id }
    post:
      summary: Register an officer on a session's attendance
      description: >
        Requires `training.cert.write`. One row per officer per session (409 on
        a duplicate). Publishes an `AttendanceRecorded` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: session_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceCreate" }
      responses:
        "201": { description: Attendance recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Attendance" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: No session with that id }
        "409": { description: That officer is already on this session's attendance }

  /attendance/{attendance_id}:
    patch:
      summary: Update an attendance row's status (registered / attended / absent)
      description: Requires `training.cert.write`. Publishes an `AttendanceStatusChanged` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: attendance_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceStatusUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Attendance" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: No attendance record with that id }

  /courses/{course_id}/assessments:
    get:
      summary: List a course's assessments (docs §9.3.5)
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: course_id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Assessments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Assessment" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }
        "404": { description: No course with that id }
    post:
      summary: Create an assessment for a course
      description: Requires `training.cert.write`. Publishes an `AssessmentCreated` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: course_id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentCreate" }
      responses:
        "201": { description: Assessment created, content: { application/json: { schema: { $ref: "#/components/schemas/Assessment" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: No course with that id }

  /assessments/{assessment_id}:
    get:
      summary: Get an assessment
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: assessment_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Assessment, content: { application/json: { schema: { $ref: "#/components/schemas/Assessment" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }
        "404": { description: No assessment with that id }

  /assessments/{assessment_id}/results:
    get:
      summary: List an assessment's results (docs §9.3.5)
      description: Requires `training.cert.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: assessment_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Results, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AssessmentResult" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.read }
        "404": { description: No assessment with that id }
    post:
      summary: Record a graded result for an assessment
      description: >
        Requires `training.cert.write`. `passed` is derived server-side
        (`score >= passing_score`) at grading time and stored — a later change
        to the assessment's `passing_score` never rewrites it. Recording a
        pass does **not** auto-issue a certification (that stays an explicit
        `POST /officer-certifications` action). Publishes an
        `AssessmentResultRecorded` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: assessment_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentResultCreate" }
      responses:
        "201": { description: Result recorded, content: { application/json: { schema: { $ref: "#/components/schemas/AssessmentResult" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks training.cert.write }
        "404": { description: No assessment with that id }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 access token issued by iam-service (/api/v1/auth/mfa/verify).
  schemas:
    CourseCreate:
      type: object
      required: [title, validity_months]
      properties:
        title: { type: string }
        validity_months: { type: integer, minimum: 1 }
        mandatory: { type: boolean, default: false }
    CourseUpdate:
      type: object
      properties:
        title: { type: string, nullable: true }
        validity_months: { type: integer, minimum: 1, nullable: true }
        mandatory: { type: boolean, nullable: true }
    Course:
      allOf:
        - $ref: "#/components/schemas/CourseCreate"
        - type: object
          properties:
            id: { type: integer }

    CertificationCreate:
      type: object
      required: [course_id]
      properties:
        course_id: { type: integer }
    Certification:
      allOf:
        - $ref: "#/components/schemas/CertificationCreate"
        - type: object
          properties:
            id: { type: integer }

    OfficerCertificationCreate:
      type: object
      required: [officer_id, certification_id]
      properties:
        officer_id: { type: string, format: uuid }
        certification_id: { type: integer }
        issued_date: { type: string, format: date, nullable: true, description: "Defaults to today if omitted." }
    OfficerCertification:
      allOf:
        - $ref: "#/components/schemas/OfficerCertificationCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            issued_date: { type: string, format: date }
            expires_date: { type: string, format: date, description: "Computed server-side: issued_date + course.validity_months." }
            status: { type: string, enum: [active, expiring_soon, expired] }

    Material:
      type: object
      properties:
        id: { type: string, format: uuid }
        course_id: { type: integer }
        title: { type: string }
        file_ref: { type: string, description: "Opaque object-storage key" }

    SessionCreate:
      type: object
      required: [course_id, scheduled_at]
      properties:
        course_id: { type: integer }
        scheduled_at: { type: string, format: date-time }
        location: { type: string, nullable: true, maxLength: 200 }
        instructor_officer_id: { type: string, format: uuid, nullable: true }
        capacity: { type: integer, minimum: 1, nullable: true }
    SessionUpdate:
      type: object
      properties:
        scheduled_at: { type: string, format: date-time, nullable: true }
        location: { type: string, nullable: true, maxLength: 200 }
        instructor_officer_id: { type: string, format: uuid, nullable: true }
        capacity: { type: integer, minimum: 1, nullable: true }
    Session:
      allOf:
        - $ref: "#/components/schemas/SessionCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }

    AttendanceCreate:
      type: object
      required: [officer_id]
      properties:
        officer_id: { type: string, format: uuid }
        status: { type: string, enum: [registered, attended, absent], default: registered }
    AttendanceStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [registered, attended, absent] }
    Attendance:
      allOf:
        - $ref: "#/components/schemas/AttendanceCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            session_id: { type: string, format: uuid }

    AssessmentCreate:
      type: object
      required: [title, passing_score]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        passing_score: { type: number, minimum: 0, maximum: 100 }
    Assessment:
      allOf:
        - $ref: "#/components/schemas/AssessmentCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            course_id: { type: integer }

    AssessmentResultCreate:
      type: object
      required: [officer_id, score]
      properties:
        officer_id: { type: string, format: uuid }
        score: { type: number, minimum: 0, maximum: 100 }
    AssessmentResult:
      allOf:
        - $ref: "#/components/schemas/AssessmentResultCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            assessment_id: { type: string, format: uuid }
            taken_at: { type: string, format: date-time }
            passed: { type: boolean, description: "Derived from score vs passing_score at grading time." }

    RecomputeResult:
      type: object
      required: [checked, updated]
      properties:
        checked: { type: integer }
        updated: { type: integer }
