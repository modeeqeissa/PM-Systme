openapi: 3.0.3
info:
  title: PMP Community Policing Service
  version: "1.0"
  description: >
    Implements FR-COMM-01..04 (docs Section 4.4). FastAPI must generate a
    schema that matches this contract — treat mismatches as a bug, not a spec
    update, unless the SRS itself is being revised.

    All endpoints require a bearer access token (RS256 JWT) issued by
    iam-service; its signature is verified against iam-service's JWKS and the
    required `community.<read|write>` permission must be present in the
    token's `permissions` claim (CLAUDE.md rule 4). Missing/invalid token ->
    401; valid token without the permission -> 403.

    `follow_up_actions.status` "overdue" is set only by
    `POST /follow-up-actions/recompute-status` (FR-COMM-04) or the equivalent
    periodic background sweep — never accepted from a client via
    `PATCH /follow-up-actions/{id}` (422 if attempted).

    FR-COMM-05 (summary reporting by category/station/resolution time) is
    reporting over existing data, not new domain state — like FR-HR-08 and
    FR-TRAIN-04, it is deferred to dashboard-service rather than built here.
    Note that concerns raised independently of a meeting (`meeting_id` null)
    carry no station attribution at all in this schema, which will limit any
    station-level rollup of them regardless of where it is built.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /meetings:
    post:
      summary: Log a community meeting (FR-COMM-01)
      description: Requires `community.write`. Publishes a `MeetingLogged` domain event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Meeting" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
    get:
      summary: List community meetings
      description: Requires `community.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: station_id, schema: { type: string, format: uuid } }
        - { in: query, name: community_id, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Meetings
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Meeting" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }

  /meetings/{meeting_id}:
    get:
      summary: Get a community meeting
      description: Requires `community.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: meeting_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Meeting, content: { application/json: { schema: { $ref: "#/components/schemas/Meeting" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }
        "404": { description: No meeting with that id }

  /meetings/{meeting_id}/minutes:
    get:
      summary: Get a meeting's minutes (FR-COMM-01 / docs §9.3.4)
      description: Requires `community.read`. One formal minutes record per meeting.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: meeting_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Minutes, content: { application/json: { schema: { $ref: "#/components/schemas/MeetingMinutes" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }
        "404": { description: No meeting with that id, or it has no minutes yet }
    post:
      summary: Record a meeting's minutes
      description: >
        Requires `community.write`. Creates the single minutes record for the
        meeting; 409 if it already exists (PATCH to edit). Publishes a
        `MeetingMinutesRecorded` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: meeting_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingMinutesCreate" }
      responses:
        "201": { description: Minutes recorded, content: { application/json: { schema: { $ref: "#/components/schemas/MeetingMinutes" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
        "404": { description: No meeting with that id }
        "409": { description: This meeting already has minutes — PATCH to edit them }
    patch:
      summary: Edit a meeting's minutes
      description: Requires `community.write`. Publishes a `MeetingMinutesUpdated` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: meeting_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingMinutesUpdate" }
      responses:
        "200": { description: Minutes updated, content: { application/json: { schema: { $ref: "#/components/schemas/MeetingMinutes" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
        "404": { description: No meeting with that id, or it has no minutes yet }

  /meetings/{meeting_id}/decisions:
    get:
      summary: List decisions made at a meeting (docs §9.3.4)
      description: Requires `community.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: meeting_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Decisions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Decision" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }
        "404": { description: No meeting with that id }
    post:
      summary: Record a formal decision made at a meeting
      description: >
        Requires `community.write`. The decision starts `pending`; its
        lifecycle is driven via `PATCH /decisions/{id}`. Publishes a
        `DecisionRecorded` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: meeting_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionCreate" }
      responses:
        "201": { description: Decision recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Decision" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
        "404": { description: No meeting with that id }

  /decisions/{decision_id}:
    get:
      summary: Get a decision
      description: Requires `community.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: decision_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Decision, content: { application/json: { schema: { $ref: "#/components/schemas/Decision" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }
        "404": { description: No decision with that id }
    patch:
      summary: Update a decision's status (pending / implemented / abandoned)
      description: Requires `community.write`. Publishes a `DecisionStatusChanged` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: decision_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionStatusUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Decision" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
        "404": { description: No decision with that id }

  /communities:
    get:
      summary: List communities (docs §9.3.4)
      description: Requires `community.read`. Optionally filtered by `station_id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: station_id, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Communities
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Community" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }
    post:
      summary: Create a community
      description: Requires `community.write`. Publishes a `CommunityCreated` domain event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Community" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }

  /communities/{community_id}:
    get:
      summary: Get a community
      description: Requires `community.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: community_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Community, content: { application/json: { schema: { $ref: "#/components/schemas/Community" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }
        "404": { description: No community with that id }
    patch:
      summary: Update a community (name / description)
      description: >
        Requires `community.write`. `station_id` is the ownership anchor and
        is not editable. Publishes a `CommunityUpdated` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: community_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Community" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
        "404": { description: No community with that id }

  /organizations:
    get:
      summary: List partner organizations (docs §9.3.4)
      description: Requires `community.read`. Optionally filtered by `community_id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: community_id, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Organization" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }
    post:
      summary: Create a partner organization
      description: >
        Requires `community.write`. `community_id` (optional) must reference an
        existing community. Publishes an `OrganizationCreated` domain event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
        "404": { description: community_id does not exist }

  /organizations/{organization_id}:
    get:
      summary: Get a partner organization
      description: Requires `community.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: organization_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Organization, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }
        "404": { description: No organization with that id }
    patch:
      summary: Update a partner organization
      description: Requires `community.write`. Publishes an `OrganizationUpdated` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: organization_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
        "404": { description: No organization with that id, or community_id does not exist }

  /concerns:
    post:
      summary: Log a concern (FR-COMM-02)
      description: >
        Requires `community.write`. `meeting_id` is optional — a concern may
        be raised independently of a meeting. Publishes a `ConcernLogged`
        domain event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConcernCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Concern" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
        "404": { description: meeting_id does not exist }
    get:
      summary: List concerns
      description: Requires `community.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: meeting_id, schema: { type: string, format: uuid } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [open, in_progress, resolved] } }
      responses:
        "200":
          description: Concerns
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Concern" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }

  /concerns/{concern_id}:
    get:
      summary: Get a concern
      description: Requires `community.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: concern_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Concern, content: { application/json: { schema: { $ref: "#/components/schemas/Concern" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }
        "404": { description: No concern with that id }
    patch:
      summary: Update a concern's resolution status
      description: Requires `community.write`. Publishes a `ConcernStatusChanged` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: concern_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConcernStatusUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Concern" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
        "404": { description: No concern with that id }

  /concerns/{concern_id}/follow-up-actions:
    post:
      summary: Create a follow-up action against a concern (FR-COMM-03)
      description: Requires `community.write`. Publishes a `FollowUpActionCreated` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: concern_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FollowUpActionCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FollowUpAction" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
        "404": { description: No concern with that id }
    get:
      summary: List follow-up actions for a concern
      description: Requires `community.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: concern_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Follow-up actions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FollowUpAction" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }
        "404": { description: No concern with that id }

  /follow-up-actions:
    get:
      summary: List follow-up actions (global queue)
      description: Requires `community.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: assigned_to, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [pending, overdue, completed] } }
      responses:
        "200":
          description: Follow-up actions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FollowUpAction" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }

  /follow-up-actions/{follow_up_action_id}:
    get:
      summary: Get a follow-up action
      description: Requires `community.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: follow_up_action_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Follow-up action, content: { application/json: { schema: { $ref: "#/components/schemas/FollowUpAction" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.read }
        "404": { description: No follow-up action with that id }
    patch:
      summary: Update a follow-up action's status (FR-COMM-03)
      description: >
        Requires `community.write`. Publishes a `FollowUpActionStatusChanged`
        domain event. `status: overdue` is rejected with 422 — that
        transition is system-set only, see
        `POST /follow-up-actions/recompute-status`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: follow_up_action_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FollowUpActionStatusUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/FollowUpAction" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }
        "404": { description: No follow-up action with that id }
        "422": { description: "status 'overdue' is set automatically, not via this endpoint" }

  /follow-up-actions/recompute-status:
    post:
      summary: Flag overdue follow-up actions (FR-COMM-04)
      description: >
        Requires `community.write`. Flags every pending follow-up action past
        its due_date as overdue; changed rows publish a
        `FollowUpActionStatusChanged` domain event (which notification-service
        consumes to notify the assigned officer). The same recompute also
        runs on a periodic background sweep — this endpoint is for
        on-demand/testing use.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Recompute result, content: { application/json: { schema: { $ref: "#/components/schemas/RecomputeResult" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks community.write }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 access token issued by iam-service (/api/v1/auth/mfa/verify).
  schemas:
    MeetingCreate:
      type: object
      required: [station_id, facilitator_id, meeting_date, location]
      properties:
        station_id: { type: string, format: uuid }
        community_id: { type: string, format: uuid, nullable: true, description: "The community this meeting was held with, where applicable (docs §9.3.4)" }
        facilitator_id: { type: string, format: uuid }
        meeting_date: { type: string, format: date }
        location: { type: string }
        attendee_summary: { type: string, nullable: true }
    Meeting:
      allOf:
        - $ref: "#/components/schemas/MeetingCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }

    CommunityCreate:
      type: object
      required: [name, station_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        station_id: { type: string, format: uuid }
        description: { type: string, nullable: true }
    CommunityUpdate:
      type: object
      description: Partial update — station_id is not editable.
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, nullable: true }
    Community:
      allOf:
        - $ref: "#/components/schemas/CommunityCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }

    OrganizationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        community_id: { type: string, format: uuid, nullable: true }
        contact_name: { type: string, nullable: true, maxLength: 150 }
        contact_phone: { type: string, nullable: true, maxLength: 30 }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        community_id: { type: string, format: uuid, nullable: true }
        contact_name: { type: string, nullable: true, maxLength: 150 }
        contact_phone: { type: string, nullable: true, maxLength: 30 }
    Organization:
      allOf:
        - $ref: "#/components/schemas/OrganizationCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }

    MeetingMinutesCreate:
      type: object
      required: [content, recorded_by]
      properties:
        content: { type: string, minLength: 1 }
        recorded_by: { type: string, format: uuid }
    MeetingMinutesUpdate:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
    MeetingMinutes:
      allOf:
        - $ref: "#/components/schemas/MeetingMinutesCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            meeting_id: { type: string, format: uuid }

    DecisionCreate:
      type: object
      required: [description]
      properties:
        description: { type: string, minLength: 1 }
    Decision:
      allOf:
        - $ref: "#/components/schemas/DecisionCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            meeting_id: { type: string, format: uuid }
            status: { type: string, enum: [pending, implemented, abandoned] }
    DecisionStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, implemented, abandoned] }

    ConcernCreate:
      type: object
      required: [category, description]
      properties:
        meeting_id: { type: string, format: uuid, nullable: true }
        category: { type: string }
        description: { type: string, minLength: 1 }
        raised_by: { type: string, nullable: true, maxLength: 150, description: "Free text — a community member's name/identifier, not a system user." }
    Concern:
      allOf:
        - $ref: "#/components/schemas/ConcernCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [open, in_progress, resolved] }
    ConcernStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, in_progress, resolved] }

    FollowUpActionCreate:
      type: object
      required: [description, assigned_to, due_date]
      properties:
        description: { type: string, minLength: 1 }
        assigned_to: { type: string, format: uuid }
        due_date: { type: string, format: date }
    FollowUpAction:
      allOf:
        - $ref: "#/components/schemas/FollowUpActionCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            concern_id: { type: string, format: uuid }
            status: { type: string, enum: [pending, overdue, completed] }
    FollowUpActionStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, overdue, completed] }

    RecomputeResult:
      type: object
      required: [checked, updated]
      properties:
        checked: { type: integer }
        updated: { type: integer }
