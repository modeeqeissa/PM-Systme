openapi: 3.0.3
info:
  title: PMP Human Resources Service
  version: "1.0"
  description: >
    Implements FR-HR-01..07 (docs Section 4.6). FastAPI must generate a schema
    that matches this contract — treat mismatches as a bug, not a spec update,
    unless the SRS itself is being revised.

    All endpoints require a bearer access token (RS256 JWT) issued by
    iam-service; its signature is verified against iam-service's JWKS and the
    required `<resource>.<action>` permission must be present in the token's
    `permissions` claim (CLAUDE.md rule 4). Missing/invalid token -> 401;
    valid token without the permission -> 403.

    discipline_records are additionally restricted: only hr.discipline.read /
    hr.discipline.write unlock those routes (docs Section 2.3 — HR/command
    only). FR-HR-08 (roster/headcount reports) is not implemented — it reads
    to derive reports rather than defining new domain state, and is deferred.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /units:
    post:
      summary: Create an organisational unit
      description: Requires `hr.unit.write`. Publishes a `UnitCreated` domain event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Unit" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.unit.write }
    get:
      summary: List organisational units
      description: Requires `hr.unit.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: station_id, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Units
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Unit" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.unit.read }

  /officers:
    post:
      summary: Create an officer master profile (FR-HR-01)
      description: >
        Requires `hr.officer.write`. Also opens the officer's first
        assignment (FR-HR-02) at `unit_id`. Publishes an `OfficerCreated`
        domain event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfficerCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Officer" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.officer.write }
        "404": { description: unit_id or supervisor_id does not exist }
        "409": { description: user_id or badge_number already in use }
    get:
      summary: List officers (FR-HR-01)
      description: Requires `hr.officer.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: unit_id, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [active, on_leave, suspended, retired] } }
        - { in: query, name: limit, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { in: query, name: offset, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: Officers, ordered by badge number
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Officer" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.officer.read }

  /officers/{officer_id}:
    get:
      summary: Retrieve one officer's profile (FR-HR-01)
      description: Requires `hr.officer.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Officer" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.officer.read }
        "404": { description: No officer with that id }
    patch:
      summary: Correct badge_number/hire_date/status/supervisor_id (FR-HR-01)
      description: >
        Requires `hr.officer.write`. `rank` and `unit_id` are NOT editable
        here — they're owned by the audited promotion (FR-HR-04) and
        transfer-approval (FR-HR-03) workflows. Publishes an `OfficerUpdated`
        domain event, plus an `OfficerSupervisorChanged` event if
        `supervisor_id` changed. A `supervisor_id` that doesn't reference an
        existing officer is 404; setting it to the officer's own id is 422.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfficerUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Officer" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.officer.write }
        "404": { description: No officer with that id, or supervisor_id does not exist }
        "409": { description: badge_number already in use }
        "422": { description: an officer cannot supervise themselves }

  /officers/{officer_id}/assignments:
    post:
      summary: Record a unit assignment (FR-HR-02)
      description: >
        Requires `hr.assignment.write`. Closes the officer's currently open
        assignment (if any) and updates their current unit. Publishes an
        `AssignmentRecorded` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentCreate" }
      responses:
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Assignment" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.assignment.write }
        "404": { description: No officer with that id, or unit_id does not exist }
    get:
      summary: Assignment history for one officer (FR-HR-02)
      description: Requires `hr.assignment.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Assignments, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Assignment" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.assignment.read }
        "404": { description: No officer with that id }

  /officers/{officer_id}/transfers:
    post:
      summary: Request a transfer (FR-HR-03)
      description: >
        Requires `hr.transfer.write`. Opens a `pending` transfer request;
        `from_unit_id` is the officer's current unit. Publishes a
        `TransferRequested` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferCreate" }
      responses:
        "201": { description: Requested, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.transfer.write }
        "404": { description: No officer with that id, or to_unit_id does not exist }
    get:
      summary: Transfer history for one officer (FR-HR-03)
      description: Requires `hr.transfer.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Transfers, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Transfer" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.transfer.read }
        "404": { description: No officer with that id }

  /transfers:
    get:
      summary: Approver queue — every transfer request (FR-HR-03)
      description: Requires `hr.transfer.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected] } }
      responses:
        "200":
          description: Transfers, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Transfer" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.transfer.read }

  /transfers/{transfer_id}:
    patch:
      summary: Approve or reject a pending transfer (FR-HR-03)
      description: >
        Requires `hr.transfer.approve`. approved_by and effective_date are
        required in the body when approving (422 otherwise; both ignored on
        rejection, per docs Section 9.3.6 — "set on approval"); approved_by
        must reference an existing officer (404 otherwise). On approval,
        updates the officer's current unit and closes/opens the
        corresponding assignment record, effective on effective_date (same
        effect as POST .../assignments). Publishes a `TransferStatusChanged`
        domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: transfer_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferStatusUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.transfer.approve }
        "404": { description: No transfer with that id, or approved_by does not exist }
        "409": { description: Transfer is not pending }

  /officers/{officer_id}/promotions:
    post:
      summary: Record a promotion (FR-HR-04)
      description: >
        Requires `hr.promotion.write`. No approval workflow — `previous_rank`
        is the officer's current rank at the time of recording; the officer's
        rank is updated immediately. effective_date and approved_by are
        required (docs Section 9.3.6, both NOT NULL); approved_by must
        reference an existing officer (404 otherwise). Publishes a
        `PromotionRecorded` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionCreate" }
      responses:
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Promotion" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.promotion.write }
        "404": { description: No officer with that id, or approved_by does not exist }
    get:
      summary: Promotion history for one officer (FR-HR-04)
      description: Requires `hr.promotion.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Promotions, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Promotion" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.promotion.read }
        "404": { description: No officer with that id }

  /officers/{officer_id}/leave-requests:
    post:
      summary: Request leave (FR-HR-05)
      description: >
        Requires `hr.leave.write`. Opens a `pending` leave request. Publishes
        a `LeaveRequested` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaveRequestCreate" }
      responses:
        "201": { description: Requested, content: { application/json: { schema: { $ref: "#/components/schemas/LeaveRequest" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.leave.write }
        "404": { description: No officer with that id }
    get:
      summary: Leave-request history for one officer (FR-HR-05)
      description: Requires `hr.leave.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Leave requests, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LeaveRequest" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.leave.read }
        "404": { description: No officer with that id }

  /leave-requests:
    get:
      summary: Approver queue — every leave request (FR-HR-05)
      description: Requires `hr.leave.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected] } }
      responses:
        "200":
          description: Leave requests, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LeaveRequest" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.leave.read }

  /leave-requests/{leave_request_id}:
    patch:
      summary: Approve or reject a pending leave request (FR-HR-05)
      description: >
        Requires `hr.leave.approve`. Routed to the requester's supervisor per
        FR-HR-05 — enforced here as the `hr.leave.approve` permission, held by
        Station Commander and HR Officer. approved_by is required in the body
        when approving (422 otherwise; ignored on rejection, per docs Section
        9.3.6 — "set on approval") and must reference an existing officer
        (404 otherwise). Publishes a `LeaveStatusChanged` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: leave_request_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaveStatusUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/LeaveRequest" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.leave.approve }
        "404": { description: No leave request with that id, or approved_by does not exist }
        "409": { description: Leave request is not pending }

  /officers/{officer_id}/discipline-records:
    post:
      summary: Record a discipline case (FR-HR-06)
      description: >
        Requires `hr.discipline.write`. Publishes a `DisciplineRecordCreated`
        domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisciplineRecordCreate" }
      responses:
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/DisciplineRecord" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.discipline.write }
        "404": { description: No officer with that id }
    get:
      summary: Discipline-record history for one officer (FR-HR-06)
      description: >
        Requires `hr.discipline.read` — HR/command only (docs Section 2.3).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Discipline records, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DisciplineRecord" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.discipline.read }
        "404": { description: No officer with that id }

  /discipline-records/{discipline_record_id}:
    get:
      summary: Retrieve one discipline record (FR-HR-06)
      description: >
        Requires `hr.discipline.read` — HR/command only (docs Section 2.3).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: discipline_record_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DisciplineRecord" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.discipline.read }
        "404": { description: No discipline record with that id }
    patch:
      summary: Update a discipline record (FR-HR-06)
      description: >
        Requires `hr.discipline.write`. Publishes a `DisciplineRecordUpdated`
        domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: discipline_record_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisciplineRecordUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/DisciplineRecord" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.discipline.write }
        "404": { description: No discipline record with that id }
    delete:
      summary: Delete a discipline record (FR-HR-06)
      description: >
        Requires `hr.discipline.write`. Publishes a `DisciplineRecordDeleted`
        domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: discipline_record_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.discipline.write }
        "404": { description: No discipline record with that id }

  /officers/{officer_id}/performance-reviews:
    post:
      summary: Record a performance review (FR-HR-07)
      description: >
        Requires `hr.performance.write`. Publishes a
        `PerformanceReviewRecorded` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PerformanceReviewCreate" }
      responses:
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceReview" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.performance.write }
        "404": { description: No officer with that id, or reviewer_id does not exist }
    get:
      summary: Performance-review history for one officer (FR-HR-07)
      description: Requires `hr.performance.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: officer_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Performance reviews, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PerformanceReview" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.performance.read }
        "404": { description: No officer with that id }

  /performance-reviews/{performance_review_id}:
    get:
      summary: Retrieve one performance review (FR-HR-07)
      description: Requires `hr.performance.read`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: performance_review_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceReview" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.performance.read }
        "404": { description: No performance review with that id }
    patch:
      summary: Update a performance review (FR-HR-07)
      description: >
        Requires `hr.performance.write`. Publishes a
        `PerformanceReviewUpdated` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: performance_review_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PerformanceReviewUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceReview" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.performance.write }
        "404": { description: No performance review with that id }
    delete:
      summary: Delete a performance review (FR-HR-07)
      description: >
        Requires `hr.performance.write`. Publishes a
        `PerformanceReviewDeleted` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: performance_review_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks hr.performance.write }
        "404": { description: No performance review with that id }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 access token issued by iam-service (/api/v1/auth/mfa/verify).
  schemas:
    UnitCreate:
      type: object
      required: [name, station_id]
      properties:
        name: { type: string }
        station_id: { type: string, format: uuid }
    Unit:
      allOf:
        - $ref: "#/components/schemas/UnitCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }

    OfficerCreate:
      type: object
      required: [user_id, badge_number, rank, unit_id, hire_date]
      properties:
        user_id: { type: string, format: uuid }
        badge_number: { type: string }
        rank: { type: string }
        unit_id: { type: string, format: uuid }
        hire_date: { type: string, format: date }
        supervisor_id: { type: string, format: uuid, nullable: true, description: "Direct supervisor (another officer); 404 if it doesn't exist." }
        status: { type: string, enum: [active, on_leave, suspended, retired], default: active }
    Officer:
      allOf:
        - $ref: "#/components/schemas/OfficerCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
    OfficerUpdate:
      type: object
      description: >
        `supervisor_id: null` clears the supervisor; omitting the key leaves it.
        A change publishes an `OfficerSupervisorChanged` event.
      properties:
        badge_number: { type: string, nullable: true }
        hire_date: { type: string, format: date, nullable: true }
        supervisor_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, on_leave, suspended, retired], nullable: true }

    AssignmentCreate:
      type: object
      required: [unit_id, start_date]
      properties:
        unit_id: { type: string, format: uuid }
        start_date: { type: string, format: date }
    Assignment:
      allOf:
        - $ref: "#/components/schemas/AssignmentCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            officer_id: { type: string, format: uuid }
            end_date: { type: string, format: date, nullable: true }

    TransferCreate:
      type: object
      required: [to_unit_id]
      properties:
        to_unit_id: { type: string, format: uuid }
    Transfer:
      allOf:
        - $ref: "#/components/schemas/TransferCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            officer_id: { type: string, format: uuid }
            from_unit_id: { type: string, format: uuid, nullable: true }
            status: { type: string, enum: [pending, approved, rejected] }
            requested_at: { type: string, format: date-time, description: "Set automatically at request time." }
            effective_date: { type: string, format: date, nullable: true, description: "Set on approval; null until then or on rejection." }
            approved_by: { type: string, format: uuid, nullable: true, description: "Set on approval; null until then or on rejection." }
            created_at: { type: string, format: date-time }
    TransferStatusUpdate:
      type: object
      required: [status]
      description: >
        approved_by and effective_date are required when status is
        "approved" (422 otherwise); both are ignored on "rejected".
      properties:
        status: { type: string, enum: [approved, rejected] }
        approved_by: { type: string, format: uuid, nullable: true }
        effective_date: { type: string, format: date, nullable: true }

    PromotionCreate:
      type: object
      required: [new_rank, effective_date, approved_by]
      description: >
        No separate approval workflow — effective_date and approved_by are
        supplied here, at recording time.
      properties:
        new_rank: { type: string }
        effective_date: { type: string, format: date }
        approved_by: { type: string, format: uuid }
    Promotion:
      allOf:
        - $ref: "#/components/schemas/PromotionCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            officer_id: { type: string, format: uuid }
            previous_rank: { type: string }
            created_at: { type: string, format: date-time }

    LeaveRequestCreate:
      type: object
      required: [leave_type, start_date, end_date]
      properties:
        leave_type: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    LeaveRequest:
      allOf:
        - $ref: "#/components/schemas/LeaveRequestCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            officer_id: { type: string, format: uuid }
            status: { type: string, enum: [pending, approved, rejected] }
            approved_by: { type: string, format: uuid, nullable: true, description: "Set on approval; null until then or on rejection." }
            created_at: { type: string, format: date-time }
    LeaveStatusUpdate:
      type: object
