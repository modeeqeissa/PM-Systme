        description: { type: string }
        outcome: { type: string, nullable: true }
        confidentiality_level: { type: string, default: restricted }
    DisciplineRecord:
      allOf:
        - $ref: "#/components/schemas/DisciplineRecordCreate"
        - type: object
          properties:
