apiVersion: v1
kind: Service
metadata:
  name: evidence
  namespace: pmp-evidence
  labels:
    app.kubernetes.io/name: evidence
    app.kubernetes.io/part-of: pmp
spec:
  type: ClusterIP          # never NodePort/LoadBalancer — only the gateway is public (§3.5)
  selector:
    app.kubernetes.io/name: evidence
  ports:
    - name: http
      port: 8003
      targetPort: http
