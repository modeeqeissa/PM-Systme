apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evidence
  namespace: pmp-evidence
  labels:
    app.kubernetes.io/name: evidence
    app.kubernetes.io/part-of: pmp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evidence
  minReplicas: 2           # PLACEHOLDER
  maxReplicas: 6           # PLACEHOLDER
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
