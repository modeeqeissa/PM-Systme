apiVersion: v1
kind: Service
metadata:
  name: case
  namespace: pmp-case
  labels:
    app.kubernetes.io/name: case
    app.kubernetes.io/part-of: pmp
spec:
  type: ClusterIP          # never NodePort/LoadBalancer — only the gateway is public (§3.5)
  selector:
    app.kubernetes.io/name: case
  ports:
    - name: http
      port: 8002
      targetPort: http
