apiVersion: v1
kind: ConfigMap
metadata:
  name: hr-config
  namespace: pmp-hr
  labels:
    app.kubernetes.io/name: hr
    app.kubernetes.io/part-of: pmp
data:
  HR_DB_HOST: postgres.pmp-data.svc.cluster.local
  HR_DB_PORT: "5432"
  HR_DB_NAME: hr_db
  HR_DB_USER: hr_service
  HR_IAM_JWKS_URL: http://iam.pmp-iam.svc.cluster.local:8001/api/v1/auth/jwks
  EVENTS_KAFKA_BOOTSTRAP: kafka.pmp-data.svc.cluster.local:9092
  EVENTS_TOPIC_PREFIX: ""
  HR_JWT_ISSUER: "pmp-iam-service"
  HR_JWKS_CACHE_TTL: "300"
