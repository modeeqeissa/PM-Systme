apiVersion: v1
kind: Service
metadata:
  name: hr
  namespace: pmp-hr
  labels:
    app.kubernetes.io/name: hr
    app.kubernetes.io/part-of: pmp
spec:
  type: ClusterIP          # never NodePort/LoadBalancer — only the gateway is public (§3.5)
  selector:
    app.kubernetes.io/name: hr
  ports:
    - name: http
      port: 8006
      targetPort: http
