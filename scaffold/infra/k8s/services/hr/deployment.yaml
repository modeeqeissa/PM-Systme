apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr
  namespace: pmp-hr
  labels:
    app.kubernetes.io/name: hr
    app.kubernetes.io/part-of: pmp
    app.kubernetes.io/component: microservice
    pmp.gov/tier: sensitive
spec:
  # PLACEHOLDER: not load-tested. HPA (hpa.yaml) drives the real count.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hr
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hr
        app.kubernetes.io/part-of: pmp
        pmp.gov/tier: sensitive
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Migrations run once, as the DB owner role, before the app starts.
      initContainers:
        - name: migrate
          image: REPLACE_ME_REGISTRY/pmp-hr:REPLACE_ME_TAG
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: hr-config }
            - secretRef: { name: hr-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
      containers:
        - name: hr
          image: REPLACE_ME_REGISTRY/pmp-hr:REPLACE_ME_TAG
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8006"]
          ports:
            - name: http
              containerPort: 8006
          envFrom:
            - configMapRef: { name: hr-config }
            - secretRef: { name: hr-secrets }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30      # up to 150s for cold start / cache warm
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # PLACEHOLDERS — size against real load before production.
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 30
