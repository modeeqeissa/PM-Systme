apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: pmp-dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: pmp
spec:
  type: ClusterIP          # never NodePort/LoadBalancer — only the gateway is public (§3.5)
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 8007
      targetPort: http
