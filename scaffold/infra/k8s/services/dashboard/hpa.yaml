apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dashboard
  namespace: pmp-dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: pmp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dashboard
  minReplicas: 2           # PLACEHOLDER
  maxReplicas: 6           # PLACEHOLDER
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # NFR-SCALE-01 also wants queue-depth scaling. Needs a custom/external
    # metrics adapter (KEDA or prometheus-adapter). Example once installed:
    # - type: External
    #   external:
    #     metric:
    #       name: kafka_consumergroup_lag
    #       selector: { matchLabels: { consumergroup: dashboard-service } }
    #     target: { type: AverageValue, averageValue: "1000" }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
