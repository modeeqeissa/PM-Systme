apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: pmp-dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: pmp
data:
  DASHBOARD_DB_HOST: postgres.pmp-data.svc.cluster.local
  DASHBOARD_DB_PORT: "5432"
  DASHBOARD_DB_NAME: dashboard_db
  DASHBOARD_DB_USER: dashboard_service
  DASHBOARD_IAM_JWKS_URL: http://iam.pmp-iam.svc.cluster.local:8001/api/v1/auth/jwks
  EVENTS_KAFKA_BOOTSTRAP: kafka.pmp-data.svc.cluster.local:9092
  EVENTS_TOPIC_PREFIX: ""
  DASHBOARD_JWT_ISSUER: "pmp-iam-service"
  DASHBOARD_JWKS_CACHE_TTL: "300"
  DASHBOARD_CONSUMER_ENABLED: "1"
  DASHBOARD_CONSUMER_GROUP: "dashboard-service"
