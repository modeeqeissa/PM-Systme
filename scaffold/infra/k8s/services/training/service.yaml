apiVersion: v1
kind: Service
metadata:
  name: training
  namespace: pmp-training
  labels:
    app.kubernetes.io/name: training
    app.kubernetes.io/part-of: pmp
spec:
  type: ClusterIP          # never NodePort/LoadBalancer — only the gateway is public (§3.5)
  selector:
    app.kubernetes.io/name: training
  ports:
    - name: http
      port: 8005
      targetPort: http
