apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: pmp-notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: pmp
data:
  NOTIFICATION_DB_HOST: postgres.pmp-data.svc.cluster.local
  NOTIFICATION_DB_PORT: "5432"
  NOTIFICATION_DB_NAME: notification_db
  NOTIFICATION_DB_USER: notification_service
  NOTIFICATION_IAM_JWKS_URL: http://iam.pmp-iam.svc.cluster.local:8001/api/v1/auth/jwks
  EVENTS_KAFKA_BOOTSTRAP: kafka.pmp-data.svc.cluster.local:9092
  EVENTS_TOPIC_PREFIX: ""
  NOTIFICATION_JWT_ISSUER: "pmp-iam-service"
  NOTIFICATION_JWKS_CACHE_TTL: "300"
  NOTIFICATION_CONSUMER_ENABLED: "1"
  NOTIFICATION_CONSUMER_GROUP: "notification-service"
  NOTIFICATION_DELIVERY_ENABLED: "1"
  NOTIFICATION_DELIVERY_POLL_SECONDS: "30"
