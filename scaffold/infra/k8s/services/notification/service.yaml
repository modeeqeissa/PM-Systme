apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: pmp-notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: pmp
spec:
  type: ClusterIP          # never NodePort/LoadBalancer — only the gateway is public (§3.5)
  selector:
    app.kubernetes.io/name: notification
  ports:
    - name: http
      port: 8008
      targetPort: http
