apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-config
  namespace: pmp-audit
  labels:
    app.kubernetes.io/name: audit
    app.kubernetes.io/part-of: pmp
data:
  AUDIT_DB_HOST: postgres.pmp-data.svc.cluster.local
  AUDIT_DB_PORT: "5432"
  AUDIT_DB_NAME: audit_db
  AUDIT_DB_OWNER_USER: audit_owner
  AUDIT_DB_APP_USER: audit_app
  AUDIT_IAM_JWKS_URL: http://iam.pmp-iam.svc.cluster.local:8001/api/v1/auth/jwks
  EVENTS_KAFKA_BOOTSTRAP: kafka.pmp-data.svc.cluster.local:9092
  EVENTS_TOPIC_PREFIX: ""
  AUDIT_JWT_ISSUER: "pmp-iam-service"
  AUDIT_JWKS_CACHE_TTL: "300"
  AUDIT_CONSUMER_ENABLED: "1"
  AUDIT_CONSUMER_GROUP: "audit-service"
  AUDIT_RETENTION_DAYS: "3650"
