apiVersion: v1
kind: Service
metadata:
  name: audit
  namespace: pmp-audit
  labels:
    app.kubernetes.io/name: audit
    app.kubernetes.io/part-of: pmp
spec:
  type: ClusterIP          # never NodePort/LoadBalancer — only the gateway is public (§3.5)
  selector:
    app.kubernetes.io/name: audit
  ports:
    - name: http
      port: 8010
      targetPort: http
