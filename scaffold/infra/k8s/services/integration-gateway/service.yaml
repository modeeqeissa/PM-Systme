apiVersion: v1
kind: Service
metadata:
  name: integration-gateway
  namespace: pmp-integration-gateway
  labels:
    app.kubernetes.io/name: integration-gateway
    app.kubernetes.io/part-of: pmp
spec:
  type: ClusterIP          # never NodePort/LoadBalancer — only the gateway is public (§3.5)
  selector:
    app.kubernetes.io/name: integration-gateway
  ports:
    - name: http
      port: 8009
      targetPort: http
