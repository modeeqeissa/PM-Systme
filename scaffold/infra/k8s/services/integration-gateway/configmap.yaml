apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-gateway-config
  namespace: pmp-integration-gateway
  labels:
    app.kubernetes.io/name: integration-gateway
    app.kubernetes.io/part-of: pmp
data:
  INTEGRATION_GATEWAY_DB_HOST: postgres.pmp-data.svc.cluster.local
  INTEGRATION_GATEWAY_DB_PORT: "5432"
  INTEGRATION_GATEWAY_DB_NAME: integration_db
  INTEGRATION_GATEWAY_DB_USER: integration_gateway_service
  INTEGRATION_GATEWAY_IAM_JWKS_URL: http://iam.pmp-iam.svc.cluster.local:8001/api/v1/auth/jwks
  EVENTS_KAFKA_BOOTSTRAP: kafka.pmp-data.svc.cluster.local:9092
  EVENTS_TOPIC_PREFIX: ""
  INTEGRATION_GATEWAY_JWT_ISSUER: "pmp-iam-service"
  INTEGRATION_GATEWAY_JWKS_CACHE_TTL: "300"
