apiVersion: v1
kind: ResourceQuota
metadata:
  name: iam-quota
  namespace: pmp-iam
  labels: { app.kubernetes.io/part-of: pmp }
spec:
  # PLACEHOLDER budgets — §3.6 "its own resource quotas". Tune per environment.
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "20"
