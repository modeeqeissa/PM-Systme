---
# The API gateway (§3.5 — TLS termination, JWT validation, rate limits) is a
# SEPARATE deployment (Kong / Envoy Gateway / APISIX — not a PMP microservice).
# Every service NetworkPolicy allows ingress only from a namespace carrying
# `pmp.gov/role: gateway`; create that gateway here (or wherever it lives) with
# this label.
apiVersion: v1
kind: Namespace
metadata:
  name: pmp-gateway
  labels:
    app.kubernetes.io/part-of: pmp
    pmp.gov/role: gateway
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
# The data plane (PostgreSQL — one DB per service — plus Kafka and the object
# store for the evidence vault). Provided EXTERNALLY: an in-cluster operator
# (CloudNativePG / Strimzi / MinIO) OR a managed service (RDS / MSK / S3).
#   - in-cluster: keep this namespace, label it `pmp.gov/plane: data`, deploy
#     the operators here; the service NetworkPolicies already allow egress to it.
#   - managed / off-cluster: delete this namespace and switch the data-plane
#     egress rules in each service to `ipBlock` CIDRs (each NetworkPolicy has a
#     commented example; see README).
apiVersion: v1
kind: Namespace
metadata:
  name: pmp-data
  labels:
    app.kubernetes.io/part-of: pmp
    pmp.gov/plane: data
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
