# One namespace per microservice (docs §3.6). `pmp.gov/tier: sensitive` marks
# the evidence and hr namespaces, which get the stricter network posture and a
# dedicated encryption-key Secret (§3.6 / NFR-SEC-05).
#
# Pod Security Admission is set to "restricted" everywhere — the Deployments are
# already written to satisfy it (non-root, no privilege escalation, seccomp,
# read-only rootfs, all caps dropped).
---
apiVersion: v1
kind: Namespace
metadata:
  name: pmp-iam
  labels:
    app.kubernetes.io/part-of: pmp
    pmp.gov/tier: standard
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
