openapi: 3.0.3
info:
  title: PMP Case Management Service
  version: "1.0"
  description: >
    Implements FR-CASE-01..10 (docs Section 4.2). FastAPI must generate a schema
    that matches this contract — treat mismatches as a bug, not a spec update,
    unless the SRS itself is being revised.

    All endpoints require a bearer access token (RS256 JWT) issued by
    iam-service; its signature is verified against iam-service's JWKS and the
    required `<resource>.<action>` permission must be present in the token's
    `permissions` claim (CLAUDE.md rule 4). Missing/invalid token -> 401;
    valid token without the permission -> 403.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /incidents:
    post:
      summary: Create a new incident (FR-CASE-01, FR-CASE-10)
      description: Requires the `case.write` permission.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } } }
        "200": { description: Idempotent replay - existing record returned }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.write }
  /cases:
    get:
      summary: List cases visible to the caller (FR-CASE-03, FR-IAM-04)
      description: >
        Requires `case.read`. Returns cases where the caller is the
        `lead_officer_id`; a caller holding `case.approve` (supervisory) sees all
        cases. Cases carry no station column, so station-level scoping per
        FR-IAM-04 is approximated by lead-officer ownership for now.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, investigating, referred_prosecution, closed, suspended] } }
        - { in: query, name: limit, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { in: query, name: offset, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: Cases, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Case" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.read }
    post:
      summary: Escalate an incident into a formal case (FR-CASE-02)
      description: >
        Requires `case.write`. Assigns a unique, sequential case number and opens
        the case (`status: open`). Publishes a `CaseOpened` domain event.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseCreate" }
      responses:
        "201": { description: Case opened, content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.write }
        "404": { description: incident_id does not exist }
  /cases/{case_id}:
    get:
      summary: Retrieve full case detail (FR-CASE-03)
      description: Requires the `case.read` permission.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: RBAC scope denied }
        "404": { description: Not found }
  /cases/{case_id}/status:
    patch:
      summary: Transition case status through the defined lifecycle (FR-CASE-03)
      security: [{ bearerAuth: [] }]
      description: >
        Requires the `case.write` permission. Moves a case along the lifecycle
        graph below. Any move not listed is rejected with 409 (including a no-op
        transition to the current status):

          open                  -> investigating | suspended | closed
          investigating         -> referred_prosecution | suspended | closed
          referred_prosecution  -> investigating | closed
          suspended             -> open | investigating | closed
          closed                -> (terminal, no transitions)

        Transitioning to `closed` stamps `closed_at` (server time) if not already set.
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, investigating, referred_prosecution, closed, suspended]
      responses:
        "200":
          description: Updated - returns the full case with the new status
          content: { application/json: { schema: { $ref: "#/components/schemas/Case" } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.write }
        "404": { description: No case with that id }
        "409": { description: Invalid status transition }
  /cases/{case_id}/arrests:
    get:
      summary: List arrests recorded against a case (FR-CASE-04)
      description: Requires the `case.read` permission.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Arrests, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Arrest" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.read }
        "404": { description: No case with that id }
    post:
      summary: Record an arrest against a case
      description: >
        Requires `case.write`. Publishes an `ArrestRecorded` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArrestCreate" }
      responses:
        "201": { description: Arrest recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Arrest" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.write }
        "404": { description: No case with that id }
  /cases/{case_id}/statements:
    get:
      summary: List statements recorded against a case (FR-CASE-05)
      description: Requires the `case.read` permission.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Statements, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Statement" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.read }
        "404": { description: No case with that id }
    post:
      summary: Record a witness/suspect/victim statement against a case (FR-CASE-05)
      description: >
        Requires `case.write`. Publishes a `StatementRecorded` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatementCreate" }
      responses:
        "201": { description: Statement recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Statement" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.write }
        "404": { description: No case with that id }
  /cases/{case_id}/court-proceedings:
    get:
      summary: List court proceedings recorded against a case (FR-CASE-06)
      description: Requires the `case.read` permission.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Court proceedings, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CourtProceeding" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.read }
        "404": { description: No case with that id }
    post:
      summary: Record a court proceeding against a case (FR-CASE-06)
      description: >
        Requires `case.write`. Publishes a `CourtProceedingRecorded` domain event.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourtProceedingCreate" }
      responses:
        "201": { description: Court proceeding recorded, content: { application/json: { schema: { $ref: "#/components/schemas/CourtProceeding" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.write }
        "404": { description: No case with that id }
  /cases/{case_id}/officers:
    get:
      summary: List supporting officers assigned to a case (FR-CASE-07)
      description: Requires the `case.read` permission.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current assignments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CaseOfficer" } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.read }
        "404": { description: No case with that id }
    post:
      summary: Assign or reassign a supporting officer on a case (FR-CASE-07)
      description: >
        Requires `case.approve` — staffing an investigation is a command
        decision (docs §2.3, Station Commander), not a field-officer action.
        A first assignment returns 201; posting again for an officer already on
        the case updates their `role_on_case` and returns 200. Publishes a
        `CaseOfficerAssigned` domain event, which notification-service turns
        into a notification for the affected officer. `officer_id` is a logical
        reference to hr_db.officers.id and is not validated here.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseOfficerAssign" }
      responses:
        "201": { description: Officer assigned, content: { application/json: { schema: { $ref: "#/components/schemas/CaseOfficer" } } } }
        "200": { description: Existing assignment's role updated, content: { application/json: { schema: { $ref: "#/components/schemas/CaseOfficer" } } } }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.approve }
        "404": { description: No case with that id }
  /cases/{case_id}/officers/{officer_id}:
    delete:
      summary: Remove a supporting officer from a case (FR-CASE-07)
      description: >
        Requires `case.approve`. Hard-deletes the join row (`case_officers` is a
        plain many-to-many junction, docs §9.3.2) and publishes a
        `CaseOfficerUnassigned` domain event. The case record itself is never
        deleted (FR-CASE-09).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: case_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: officer_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Officer unassigned }
        "401": { description: Missing or invalid access token }
        "403": { description: Caller lacks case.approve }
        "404": { description: No case with that id, or officer not assigned to it }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 access token issued by iam-service (/api/v1/auth/mfa/verify).
  schemas:
    IncidentCreate:
      type: object
      required: [reported_by, incident_type, description, station_id, reported_at]
      properties:
        reported_by: { type: string, format: uuid }
        incident_type: { type: string }
        description: { type: string }
        latitude: { type: number, format: float, nullable: true }
        longitude: { type: number, format: float, nullable: true }
        station_id: { type: string, format: uuid }
        reported_at: { type: string, format: date-time }
    Incident:
      allOf:
        - $ref: "#/components/schemas/IncidentCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    Case:
      type: object
      properties:
        id: { type: string, format: uuid }
        case_number: { type: string }
        incident_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [open, investigating, referred_prosecution, closed, suspended] }
        lead_officer_id: { type: string, format: uuid }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
    CaseCreate:
      type: object
      required: [lead_officer_id]
      properties:
        incident_id: { type: string, format: uuid, nullable: true }
        lead_officer_id: { type: string, format: uuid }
    ArrestCreate:
      type: object
      required: [officer_id, suspect_id, arrest_date]
      properties:
        officer_id: { type: string, format: uuid }
        suspect_id: { type: string, format: uuid }
        arrest_date: { type: string, format: date-time }
        location: { type: string, nullable: true }
        legal_basis: { type: string, nullable: true }
    Arrest:
      allOf:
        - $ref: "#/components/schemas/ArrestCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            case_id: { type: string, format: uuid }
    StatementCreate:
      type: object
      required: [recorded_by, party_type, statement_text]
      properties:
        recorded_by: { type: string, format: uuid }
        party_type: { type: string, enum: [witness, suspect, victim] }
        statement_text: { type: string }
    Statement:
      allOf:
        - $ref: "#/components/schemas/StatementCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            case_id: { type: string, format: uuid }
            recorded_at: { type: string, format: date-time }
    CourtProceedingCreate:
      type: object
      required: [hearing_date]
      properties:
        hearing_date: { type: string, format: date-time }
        court_name: { type: string, nullable: true }
        verdict: { type: string, nullable: true }
        notes: { type: string, nullable: true }
    CourtProceeding:
      allOf:
        - $ref: "#/components/schemas/CourtProceedingCreate"
        - type: object
          properties:
            id: { type: string, format: uuid }
            case_id: { type: string, format: uuid }
    CaseOfficerAssign:
      type: object
      required: [officer_id, role_on_case]
      properties:
        officer_id: { type: string, format: uuid }
        role_on_case: { type: string, minLength: 1, maxLength: 30, description: "Free text; e.g. lead, support, forensic liaison (docs §9.3.2)" }
    CaseOfficer:
      allOf:
        - $ref: "#/components/schemas/CaseOfficerAssign"
        - type: object
          properties:
            case_id: { type: string, format: uuid }
